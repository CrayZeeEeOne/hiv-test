<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <title>Тест швидкості Інтернету</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        h1 {
            margin: 20px 0;
            font-size: 2.5rem;
            text-shadow: 0 0 10px #00f0ff;
        }

        h2 {
            margin: 20px 0 10px;
            font-size: 1.5rem;
            color: #0ff;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            font-size: 1rem;
        }

        input, select {
            padding: 12px;
            margin: 5px;
            border-radius: 10px;
            border: none;
            font-size: 1rem;
            width: 250px;
            max-width: 90%;
        }

        button {
            background: #00f0ff;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1rem;
            margin: 10px 5px;
            cursor: pointer;
            transition: 0.3s;
        }

            button:hover {
                background: #0ff;
            }

        pre {
            text-align: left;
            background: rgba(255,255,255,0.08);
            padding: 12px;
            border-radius: 10px;
            overflow-x: auto;
            width: 90%;
            margin: 10px auto;
        }

        hr {
            border: 1px solid rgba(255,255,255,0.1);
            margin: 20px 0;
        }

        .wave {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: -1;
        }

        @media (max-width: 600px) {
            input, select, button {
                width: 90%;
            }

            h1 {
                font-size: 2rem;
            }

            h2 {
                font-size: 1.3rem;
            }
        }
    </style>

    <!-- Google SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Facebook SDK -->
    <div id="fb-root"></div>
    <script async defer crossorigin="anonymous"
            src="https://connect.facebook.net/uk_UA/sdk.js"></script>
    <script>
        window.fbAsyncInit = function () {
            FB.init({
                appId: '10078966155483125',
                cookie: true,
                xfbml: true,
                version: 'v18.0'
            });
            FB.AppEvents.logPageView();
        };
    </script>

    <!-- Твій основний JS -->
    <script src="js/main.js" defer></script>
</head>

<body>

    <h1>Тест швидкості Інтернету</h1>

    <h2>Вхід через соціальні мережі</h2>

    <div id="g_id_onload"
         data-client_id="161637199681-cj1eqhcbbdur3rbmikk92uk7b0rlrc5p.apps.googleusercontent.com"
         data-callback="handleGoogleCredentialResponse">
    </div>
    <div class="g_id_signin" data-type="standard"></div>

    <br />

    <fb:login-button scope="public_profile,email" onlogin="checkLoginState();"></fb:login-button>

    <hr />

    <label for="server-select">Оберіть сервер:</label>
    <select id="server-select">
        {% for server in servers %}
        <option value="{{ server.id }}">{{ server.name }}</option>
        {% endfor %}
    </select>

    <label for="size-input">Розмір файлу (МБ) для тесту:</label>
    <input type="number" id="size-input" value="1" min="1" max="100" />

    <label for="ttl-input">Час життя результату (секунд):</label>
    <input type="number" id="ttl-input" value="3600" min="60" />

    <button onclick="startTest()">Почати тест</button>
    <button onclick="startTestRandom()">Тест на випадковому сервері</button>

    <h2>Результат:</h2>
    <pre id="result-area">Натисніть "Почати тест" для запуску.</pre>

    <h2>Статистика</h2>
    <pre id="stats-area">Статистика недоступна.</pre>

    {% if user_id and user_id != 'guest' %}
        <div style="display: flex; gap: 10px; justify-content: center; margin: 20px 0;">
            <button onclick="window.location.href='/cabinet'">Кабінет користувача</button>
            <button onclick="logout()" style="background: #ff4444;">Вийти</button>
        </div>
    {% else %}
        <div id="auth-buttons" style="margin: 20px 0;">
            <div id="g_id_onload"
                data-client_id="161637199681-cj1eqhcbbdur3rbmikk92uk7b0rlrc5p.apps.googleusercontent.com"
                data-callback="handleGoogleCredentialResponse"
                data-auto_prompt="false">
            </div>
            <button class="g_id_signin"
                    data-type="standard"
                    data-theme="filled_blue"
                    style="background: #4285F4; border: none; padding: 12px 24px; border-radius: 4px; color: white; cursor: pointer; margin: 5px;">
                Увійти через Google
            </button>

            <button onclick="facebookLogin()"
                    style="background: #1877F2; border: none; padding: 12px 24px; border-radius: 4px; color: white; cursor: pointer; margin: 5px;">
                Увійти через Facebook
            </button>
        </div>
    {% endif %}

    <h2>Історія тестів (в межах сесії):</h2>
    <div id="history-area"></div>

    <svg class="wave" viewBox="0 0 1440 320">
        <path fill="#00f0ff" fill-opacity="0.3"
              d="M0,160L40,170C80,180,160,200,240,197.3C320,195,400,169,480,176C560,183,640,225,720,240C800,255,880,245,960,213.3C1040,182,1120,128,1200,117.3C1280,107,1360,139,1400,154.7L1440,170L1440,320L0,320Z"></path>
    </svg>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
