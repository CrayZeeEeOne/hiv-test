<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <title>Тест швидкості Інтернету</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        h1 {
            margin: 20px 0;
            font-size: 2.5rem;
            text-shadow: 0 0 10px #00f0ff;
        }

        h2 {
            margin: 20px 0 10px;
            font-size: 1.5rem;
            color: #0ff;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            font-size: 1rem;
        }

        input, select {
            padding: 12px;
            margin: 5px;
            border-radius: 10px;
            border: none;
            font-size: 1rem;
            width: 250px;
            max-width: 90%;
        }

        button {
            background: #00f0ff;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1rem;
            margin: 10px 5px;
            cursor: pointer;
            transition: all 0.25s ease;
            transform: scale(1);
        }

        button:hover {
            background: #0ff;
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
        }

        button:active {
            transform: scale(0.95);
        }

        .wave {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: -1;
        }

        .social-login, .card-block {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(8px);
            padding: 20px;
            border-radius: 20px;
            margin: 20px auto;
            max-width: 800px;
            box-shadow: 0 0 15px rgba(0,240,255,0.15);
            transition: 0.3s ease;
        }

        .social-login h2, .card-block h2 {
            margin-bottom: 15px;
            color: #0ff;
            text-shadow: 0 0 8px #0ff;
        }

        .social-login div, .social-login fb\\:login-button {
            margin: 10px 0;
        }

        .g_id_signin, fb\\:login-button {
            transition: 0.3s ease;
        }

        .g_id_signin:hover, fb\\:login-button:hover {
            transform: scale(1.05);
        }

        .card-block pre {
            text-align: left;
            background: rgba(255,255,255,0.08);
            padding: 12px;
            border-radius: 10px;
            overflow-x: auto;
            width: 90%;
            margin: 10px auto;
            color: #fff;
        }

        .card-block div {
            padding: 10px;
            color: #ccc;
            text-align: left;
        }

        @media (max-width: 600px) {
            input, select, button {
                width: 90%;
            }

            h1 {
                font-size: 2rem;
            }

            h2 {
                font-size: 1.3rem;
            }

            .social-login, .card-block {
                padding: 15px;
            }
        }
    </style>
    <script src="js/main.js" defer></script>
</head>

<body>

    <h1>Тест швидкості Інтернету</h1>

    <label for="server-select">Оберіть сервер:</label>
    <select id="server-select">
        {% for server in servers %}
        <option value="{{ server.id }}">{{ server.name }}</option>
        {% endfor %}
    </select>

    <label for="size-input">Розмір файлу (МБ) для тесту:</label>
    <input type="number" id="size-input" value="1" min="1" max="100" />

    <label for="ttl-input">Час життя результату (секунд):</label>
    <input type="number" id="ttl-input" value="3600" min="60" />

    <button onclick="startTest()">Почати тест</button>
    <button onclick="startTestRandom()">Тест на випадковому сервері</button>

    <div class="card-block">
        <h2>Результат:</h2>
        <pre id="result-area">Натисніть "Почати тест" для запуску.</pre>
    </div>

    <div class="card-block">
        <h2>Статистика</h2>
        <pre id="stats-area">Статистика недоступна.</pre>
    </div>

    {% if logged_in %}
    <button onclick="window.location.href='/cabinet'">Кабінет користувача</button>
    <button onclick="logout()">Вийти</button>
    {% else %}
    <button onclick="window.location.href='/login'">Увійти</button>
    {% endif %}

    <div class="card-block">
        <h2>Історія тестів (в межах сесії):</h2>
        <div id="history-area">Немає записів.</div>
    </div>

    <svg class="wave" viewBox="0 0 1440 320">
        <path fill="#00f0ff" fill-opacity="0.3"
              d="M0,160L40,170C80,180,160,200,240,197.3C320,195,400,169,480,176C560,183,640,225,720,240C800,255,880,245,960,213.3C1040,182,1120,128,1200,117.3C1280,107,1360,139,1400,154.7L1440,170L1440,320L0,320Z"></path>
    </svg>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
