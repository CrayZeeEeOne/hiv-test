<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <title>Тест швидкості Інтернету</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        h1 {
            margin: 20px 0;
            font-size: 2.5rem;
            text-shadow: 0 0 10px #00f0ff;
        }

        h2 {
            margin: 20px 0 10px;
            font-size: 1.5rem;
            color: #0ff;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            font-size: 1rem;
        }

        input, select {
            padding: 12px;
            margin: 5px;
            border-radius: 10px;
            border: 1px solid rgba(0, 240, 255, 0.4);
            font-size: 1rem;
            width: 250px;
            max-width: 90%;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            transition: all 0.25s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #0ff;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
            background: rgba(255, 255, 255, 0.08);
        }

        select option {
            background: #203a43;
            color: #fff;
        }

        .fancy-btn {
            background: linear-gradient(135deg, #00f0ff, #0ff);
            border: none;
            padding: 14px 26px;
            border-radius: 12px;
            font-size: 1rem;
            margin: 12px 5px;
            cursor: pointer;
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0,240,255,0.4);
            transition: all 0.4s ease;
            background-size: 200% 200%;
        }

        .fancy-btn:hover {
            background-position: right center;
            transform: scale(1.08);
            box-shadow: 0 0 18px rgba(0,240,255,0.7);
        }

        .fancy-btn:active {
            transform: scale(0.95);
        }

        .card-block {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(8px);
            padding: 20px;
            border-radius: 20px;
            margin: 20px auto;
            max-width: 800px;
            box-shadow: 0 0 15px rgba(0,240,255,0.15);
            transition: 0.3s ease;
        }

        .card-block h2 {
            margin-bottom: 15px;
            color: #0ff;
            text-shadow: 0 0 8px #0ff;
        }

        .card-block pre {
            text-align: left;
            background: rgba(255,255,255,0.08);
            padding: 12px;
            border-radius: 10px;
            overflow-x: auto;
            width: 90%;
            margin: 10px auto;
            color: #fff;
        }

        .social-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 20px 0;
        }

        .social-btn {
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 12px rgba(0,0,0,0.4);
            transition: 0.3s ease;
        }

        .social-btn img {
            width: 30px;
            height: 30px;
        }

        .social-btn.google {
            background: #fff;
        }

        .social-btn.facebook {
            background: #1877f2;
        }

        .social-btn.google:hover {
            transform: scale(1.08);
            box-shadow: 0 0 16px rgba(255,255,255,0.6);
        }

        .social-btn.facebook:hover {
            transform: scale(1.08);
            box-shadow: 0 0 16px rgba(24,119,242,0.6);
        }

        .logout-btn {
            background: linear-gradient(135deg, #00f0ff, #0ff);
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-top: 10px;
            cursor: pointer;
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 8px rgba(0,240,255,0.4);
            transition: 0.3s ease;
        }

        .logout-btn:hover {
            background-position: right center;
            transform: scale(1.06);
            box-shadow: 0 0 14px rgba(0,240,255,0.6);
        }

        .logout-btn:active {
            transform: scale(0.95);
        }

        .wave {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: -1;
        }

        @media (max-width: 600px) {
            input, select, .fancy-btn {
                width: 90%;
            }

            h1 {
                font-size: 2rem;
            }

            h2 {
                font-size: 1.3rem;
            }

            .card-block {
                padding: 15px;
            }
        }
    </style>


    <!-- Google SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Facebook SDK -->
    <div id="fb-root"></div>
    <script async defer crossorigin="anonymous"
            src="https://connect.facebook.net/uk_UA/sdk.js"></script>
    <script>
        window.fbAsyncInit = function () {
            FB.init({
                appId: '10078966155483125',
                cookie: true,
                xfbml: true,
                version: 'v18.0'
            });
            FB.AppEvents.logPageView();
        };
    </script>

    <!-- Твій основний JS -->
    <script src="js/main.js" defer></script>
</head>

<body>

    <h1>Тест швидкості Інтернету</h1>

    <h2>Вхід через соціальні мережі</h2>

    <label for="server-select">Оберіть сервер:</label>
    <select id="server-select">
        {% for server in servers %}
        <option value="{{ server.id }}">{{ server.name }}</option>
        {% endfor %}
    </select>

    <label for="size-input">Розмір файлу (МБ) для тесту:</label>
    <input type="number" id="size-input" value="1" min="1" max="100" />

    <label for="ttl-input">Час життя результату (секунд):</label>
    <input type="number" id="ttl-input" value="3600" min="60" />

    <button onclick="startTest()">Почати тест</button>
    <button onclick="startTestRandom()">Тест на випадковому сервері</button>

    <h2>Результат:</h2>
    <pre id="result-area">Натисніть "Почати тест" для запуску.</pre>

    <h2>Статистика</h2>
    <pre id="stats-area">Статистика недоступна.</pre>

    {% if user_id and user_id != 'guest' %}
        <div style="margin: 20px 0;">
            <button onclick="window.location.href='/cabinet'">Кабінет користувача</button>
            <button onclick="logout()">Вийти</button>
        </div>
    {% else %}
        <div id="auth-buttons" style="margin: 20px 0;">
            <div id="g_id_onload"
                data-client_id="161637199681-cj1eqhcbbdur3rbmikk92uk7b0rlrc5p.apps.googleusercontent.com"
                data-callback="handleGoogleCredentialResponse"
                data-auto_prompt="false">
            </div>
            <button class="g_id_signin"
                    data-type="standard"
                    data-theme="filled_blue"
                    style="background: #4285F4; border: none; padding: 12px 24px; border-radius: 4px; color: white; cursor: pointer; margin: 5px;">
                Увійти через Google
            </button>

            <button onclick="facebookLogin()"
                    style="background: #1877F2; border: none; padding: 12px 24px; border-radius: 4px; color: white; cursor: pointer; margin: 5px;">
                Увійти через Facebook
            </button>
        </div>
    {% endif %}

    <h2>Історія тестів (в межах сесії):</h2>
    <div id="history-area"></div>

    <svg class="wave" viewBox="0 0 1440 320">
        <path fill="#00f0ff" fill-opacity="0.3"
              d="M0,160L40,170C80,180,160,200,240,197.3C320,195,400,169,480,176C560,183,640,225,720,240C800,255,880,245,960,213.3C1040,182,1120,128,1200,117.3C1280,107,1360,139,1400,154.7L1440,170L1440,320L0,320Z"></path>
    </svg>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
