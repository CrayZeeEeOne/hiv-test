<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Авторизація</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,240,255,0.15);
        }
        h1 {
            margin-bottom: 20px;
            font-size: 2rem;
            text-shadow: 0 0 10px #00f0ff;
        }
        .social-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 20px 0;
        }
        .social-btn {
            flex: 1;
            padding: 14px 0;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            color: #000;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .social-btn img {
            width: 22px;
            height: 22px;
        }
        .google-btn {
            background: #fff;
            color: #000;
        }
        .facebook-btn {
            background: #1877f2;
            color: #fff;
        }
        .google-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(255,255,255,0.4);
        }
        .facebook-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(24,119,242,0.5);
        }
        button.main-btn {
            background: #00f0ff;
            border: none;
            padding: 14px 26px;
            border-radius: 12px;
            font-size: 1rem;
            margin-top: 20px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        button.main-btn:hover {
            background: #0ff;
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
        }
        button.main-btn:active {
            transform: scale(0.95);
        }
        @media (max-width: 480px) {
            .social-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Авторизація</h1>

        <div class="social-buttons">
            <button class="social-btn google-btn" onclick="window.location.href='/login/google'">
                <img src="https://cdn-icons-png.flaticon.com/512/281/281764.png" alt="Google">
                Google
            </button>
            <button class="social-btn facebook-btn" onclick="window.location.href='/login/facebook'">
                <img src="https://cdn-icons-png.flaticon.com/512/124/124010.png" alt="Facebook">
                Facebook
            </button>

        </div>

        <button class="main-btn" onclick="window.location.href='/'">⬅️ На головну</button>
    </div>

    <script>
        function googleLogin() {
            alert("Google авторизація — підключення.");
        }
        function facebookLogin() {
            alert("Facebook авторизація — підключення.");
        }
    </script>
</body>
</html>
