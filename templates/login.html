<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <title>Вхід через Google та Facebook</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 0 0 10px #00f0ff;
        }

        .login-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 280px;
            margin-top: 20px;
        }

        button, .custom-button {
            padding: 12px 20px;
            font-size: 1.2rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: white;
        }

        button.facebook {
            background-color: #1877f2;
        }
        button.facebook:hover {
            background-color: #155db2;
        }

        .btn-home {
            background-color: #444;
            margin-top: 40px;
            width: 280px;
        }
        .btn-home:hover {
            background-color: #222;
        }

        #status {
            margin-top: 30px;
            font-size: 1.1rem;
            min-height: 1.2em;
        }
    </style>

    <!-- Google Platform Library -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Facebook SDK -->
    <div id="fb-root"></div>
    <script async defer crossorigin="anonymous"
            src="https://connect.facebook.net/uk_UA/sdk.js"></script>
    <script>
        window.fbAsyncInit = function () {
            FB.init({
                appId: '10078966155483125',  // Замінити на свій App ID
                cookie: true,
                xfbml: false,
                version: 'v18.0'
            });
        };
    </script>
</head>
<body>

    <h1>Вхід через соціальні мережі</h1>

    <div class="login-buttons">

        <!-- Google кнопка (буде відрендерена автоматично) -->
        <div id="g_id_onload"
             data-client_id="161637199681-cj1eqhcbbdur3rbmikk92uk7b0rlrc5p.apps.googleusercontent.com"
             data-callback="handleGoogleCredentialResponse"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin"></div>

        <!-- Facebook кнопка -->
        <button class="facebook" id="fbLoginBtn">
            <img src="https://cdn-icons-png.flaticon.com/512/124/124010.png" alt="Facebook" width="20" />
            Увійти через Facebook
        </button>
    </div>

    <!-- Кнопка "На головну" -->
    <button class="btn-home" id="btnHome">На головну</button>

    <div id="status"></div>

    <script>
        // Обробник Facebook Login
        document.getElementById('fbLoginBtn').onclick = function() {
            FB.login(function(response) {
                if (response.status === 'connected') {
                    FB.api('/me', {fields: 'name,email'}, function(userData) {
                        document.getElementById('status').textContent = `Привіт, ${userData.name}! Успішний вхід через Facebook.`;
                        // Редірект після успішного входу
                        setTimeout(() => window.location.href = '/', 1500);
                    });
                } else {
                    document.getElementById('status').textContent = 'Вхід через Facebook скасовано або не вдалий.';
                }
            }, {scope: 'public_profile,email'});
        };

        // Обробник Google Credential Response
        function handleGoogleCredentialResponse(response) {
            try {
                const payload = JSON.parse(atob(response.credential.split('.')[1]));
                document.getElementById('status').textContent = `Привіт, ${payload.name}! Успішний вхід через Google.`;
                // Редірект після успішного входу
                setTimeout(() => window.location.href = '/', 1500);
            } catch (e) {
                document.getElementById('status').textContent = 'Помилка входу через Google.';
            }
        }

        // Кнопка "На головну"
        document.getElementById('btnHome').onclick = function() {
            window.location.href = '/';
        };
    </script>

</body>
</html>
