<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Авторизація</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,240,255,0.15);
        }
        h1 {
            margin-bottom: 20px;
            font-size: 2rem;
            text-shadow: 0 0 10px #00f0ff;
        }
        .social-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 20px 0;
        }
        .social-btn {
            flex: 1;
            padding: 14px 0;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            color: #000;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .social-btn img {
            width: 22px;
            height: 22px;
        }
        .google-btn {
            background: #fff;
            color: #000;
        }
        .facebook-btn {
            background: #1877f2;
            color: #fff;
        }
        .google-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(255,255,255,0.4);
        }
        .facebook-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(24,119,242,0.5);
        }
        button.main-btn {
            background: #00f0ff;
            border: none;
            padding: 14px 26px;
            border-radius: 12px;
            font-size: 1rem;
            margin-top: 20px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        button.main-btn:hover {
            background: #0ff;
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
        }
        button.main-btn:active {
            transform: scale(0.95);
        }
        @media (max-width: 480px) {
            .social-buttons {
                flex-direction: column;
            }
        }
    </style>
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Facebook SDK -->
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/uk_UA/sdk.js#xfbml=1&version=v18.0&appId=YOUR_FACEBOOK_APP_ID&autoLogAppEvents=1" nonce="YOUR_NONCE"></script>
</head>
<body>
    <div class="login-card">
        <h1>Авторизація</h1>

        <div class="social-buttons">
            <!-- Google Login Button -->
            <div id="g_id_onload"
                 data-client_id="YOUR_GOOGLE_CLIENT_ID"
                 data-context="signin"
                 data-ux_mode="popup"
                 data-callback="handleGoogleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin social-btn google-btn"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="filled_blue"
                 data-text="signin_with"
                 data-size="large"
                 data-logo_alignment="left">
            </div>

            <!-- Facebook Login Button -->
            <div class="fb-login-button social-btn facebook-btn"
                 data-width=""
                 data-size="large"
                 data-button-type="continue_with"
                 data-layout="default"
                 data-auto-logout-link="false"
                 data-use-continue-as="false"
                 onlogin="checkLoginState();">
            </div>
        </div>

        <button class="main-btn" onclick="window.location.href='/'">⬅️ На головну</button>
    </div>

    <script>
        // Ініціалізація Facebook SDK
        window.fbAsyncInit = function() {
            FB.init({
                appId: 'YOUR_FACEBOOK_APP_ID',
                cookie: true,
                xfbml: true,
                version: 'v18.0'
            });
        };

        // Обробник відповіді Google
        function handleGoogleCredentialResponse(response) {
            fetch('/login/google', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ credential: response.credential })
            })
            .then(response => response.json())
            .then(data => {
                if (data.message) {
                    window.location.href = data.redirect || '/cabinet';
                } else {
                    alert(data.error || 'Помилка авторизації через Google');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Сталася помилка при авторизації');
            });
        }

        // Перевірка стану входу Facebook
        function checkLoginState() {
            FB.getLoginStatus(function(response) {
                if (response.status === 'connected') {
                    const accessToken = response.authResponse.accessToken;
                    const userID = response.authResponse.userID;

                    fetch('/login/facebook', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ accessToken, userID })
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.message) {
                            window.location.href = data.redirect || '/cabinet';
                        } else {
                            alert(data.error || 'Помилка авторизації через Facebook');
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('Сталася помилка при авторизації');
                    });
                } else {
                    console.log('Користувач не авторизований через Facebook');
                }
            });
        }

        // Додаткові функції для кнопок (якщо потрібно)
        function googleLogin() {
            // Викликаємо клік на офіційній кнопці Google
            document.querySelector('.g_id_signin').click();
        }

        function facebookLogin() {
            // Викликаємо клік на офіційній кнопці Facebook
            document.querySelector('.fb-login-button').click();
        }
    </script>
</body>
</html>
