<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <title>Авторизація</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,240,255,0.15);
        }
        h1 {
            margin-bottom: 20px;
            font-size: 2rem;
            text-shadow: 0 0 10px #00f0ff;
        }
        .social-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 20px 0;
        }
        .social-btn {
            flex: 1;
            padding: 14px 0;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            color: #000;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .social-btn img {
            width: 22px;
            height: 22px;
        }
        .google-btn {
            background: #fff;
            color: #000;
        }
        .facebook-btn {
            background: #1877f2;
            color: #fff;
        }
        .google-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(255,255,255,0.4);
        }
        .facebook-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(24,119,242,0.5);
        }
        button.main-btn {
            background: #00f0ff;
            border: none;
            padding: 14px 26px;
            border-radius: 12px;
            font-size: 1rem;
            margin-top: 20px;
            cursor: pointer;
            transition: all 0.25s ease;
            color: #000;
        }
        button.main-btn:hover {
            background: #0ff;
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
        }
        button.main-btn:active {
            transform: scale(0.95);
        }
        @media (max-width: 480px) {
            .social-buttons {
                flex-direction: column;
            }
        }
    </style>

    <!-- Google SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Facebook SDK -->
    <div id="fb-root"></div>
    <script async defer crossorigin="anonymous"
            src="https://connect.facebook.net/uk_UA/sdk.js"></script>
    <script>
        window.fbAsyncInit = function () {
            FB.init({
                appId: '10078966155483125',
                cookie: true,
                xfbml: true,
                version: 'v18.0'
            });
            FB.AppEvents.logPageView();
        };

        function checkLoginState() {
            FB.getLoginStatus(function(response) {
                console.log('Facebook login status:', response);
                if (response.status === 'connected') {
                    const accessToken = response.authResponse.accessToken;
                    console.log('Facebook Access Token:', accessToken);
                    // Твоя логіка після успішного входу через Facebook
                    alert('Успішний вхід через Facebook!');
                } else {
                    alert('Не вдалось авторизуватись через Facebook.');
                }
            });
        }

        // Виклик Facebook Login через SDK для кнопки
        function facebookLogin() {
            FB.login(function(response) {
                if (response.authResponse) {
                    checkLoginState();
                } else {
                    alert('Facebook login cancelled or failed.');
                }
            }, {scope: 'public_profile,email'});
        }

        // Обробка відповіді Google логіну
        function handleGoogleCredentialResponse(response) {
            console.log("Google JWT Token:", response.credential);
            // Твоя логіка після успішного входу через Google
            alert('Успішний вхід через Google!');
        }

        // Виклик Google логіну при натисканні кнопки
        function googleLogin() {
            // У Google Sign-In нового SDK немає функції виклику логіну вручну,
            // але можна показати кнопку і ловити callback.
            // Тому тут ми імітуємо клік по прихованій кнопці
            // або показуємо повідомлення:
            alert('Будь ласка, натисніть кнопку Google Sign-In для входу.');
        }
    </script>

    <!-- Твій основний JS -->
    <script src="js/main.js" defer></script>
</head>
<body>
    <div class="login-card">
        <h1>Авторизація</h1>

        <div class="social-buttons">
            <button class="social-btn google-btn" onclick="googleLogin()">
                <img src="https://cdn-icons-png.flaticon.com/512/281/281764.png" alt="Google" />
                Google
            </button>
            <button class="social-btn facebook-btn" onclick="facebookLogin()">
                <img src="https://cdn-icons-png.flaticon.com/512/124/124010.png" alt="Facebook" />
                Facebook
            </button>
        </div>

        <button class="main-btn" onclick="window.location.href='/'">⬅️ На головну</button>
    </div>

    <!-- Офіційні Google Sign-In кнопки (приховані, для роботи SDK) -->
    <div id="g_id_onload"
         data-client_id="161637199681-cj1eqhcbbdur3rbmikk92uk7b0rlrc5p.apps.googleusercontent.com"
         data-callback="handleGoogleCredentialResponse"
         style="display:none">
    </div>
    <div class="g_id_signin" data-type="standard" style="display:none"></div>
</body>
</html>
