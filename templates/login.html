<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <title>Вхід через Google та Facebook</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 0 0 10px #00f0ff;
        }

        .login-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 280px;
        }

        button {
            padding: 12px 20px;
            font-size: 1.2rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button.google {
            background-color: #4285f4;
            color: white;
        }
        button.google:hover {
            background-color: #357ae8;
        }

        button.facebook {
            background-color: #1877f2;
            color: white;
        }
        button.facebook:hover {
            background-color: #155db2;
        }

        button.home {
            background-color: #444;
            color: white;
        }
        button.home:hover {
            background-color: #222;
        }

        #status {
            margin-top: 30px;
            font-size: 1.1rem;
            min-height: 1.2em;
        }
    </style>
</head>
<body>

    <h1>Вхід через соціальні мережі</h1>

    <div class="login-buttons">
        <button class="google" id="googleSignInBtn">
            <img src="https://cdn-icons-png.flaticon.com/512/281/281764.png" alt="Google" width="20" />
            Увійти через Google
        </button>

        <button class="facebook" id="fbLoginBtn">
            <img src="https://cdn-icons-png.flaticon.com/512/124/124010.png" alt="Facebook" width="20" />
            Увійти через Facebook
        </button>

        <button class="home" id="goHomeBtn">
            На головну
        </button>
    </div>

    <div id="status"></div>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Facebook SDK -->
    <script>
        window.fbAsyncInit = function() {
            FB.init({
                appId      : '10078966155483125',  // Замінити на свій App ID
                cookie     : true,
                xfbml      : false,
                version    : 'v16.0'
            });
        };

        (function(d, s, id){
           var js, fjs = d.getElementsByTagName(s)[0];
           if (d.getElementById(id)) {return;}
           js = d.createElement(s); js.id = id;
           js.src = "https://connect.facebook.net/uk_UA/sdk.js";
           fjs.parentNode.insertBefore(js, fjs);
         }(document, 'script', 'facebook-jssdk'));
    </script>

    <script>
        // Facebook Login обробник
        document.getElementById('fbLoginBtn').onclick = function() {
            FB.login(function(response) {
                if (response.status === 'connected') {
                    FB.api('/me', {fields: 'name,email'}, function(userData) {
                        document.getElementById('status').textContent = `Привіт, ${userData.name}! Успішний вхід через Facebook.`;
                        // Редірект після успішного входу
                        window.location.href = '/';  // Змінити URL якщо потрібно
                    });
                } else {
                    document.getElementById('status').textContent = 'Вхід через Facebook скасовано або не вдалий.';
                }
            }, {scope: 'public_profile,email'});
        };

        // Google Sign-In callback (новий GSI)
        function handleCredentialResponse(response) {
            try {
                const payload = JSON.parse(atob(response.credential.split('.')[1]));
                document.getElementById('status').textContent = `Привіт, ${payload.name}! Успішний вхід через Google!`;
                // Редірект після успішного входу
                setTimeout(() => {
                    window.location.href = '/';  // Змінити URL якщо потрібно
                }, 1000); // Затримка щоб побачити повідомлення
            } catch(e) {
                document.getElementById('status').textContent = 'Помилка обробки даних Google.';
            }
        }

        window.onload = function () {
            google.accounts.id.initialize({
                client_id: '161637199681-cj1eqhcbbdur3rbmikk92uk7b0rlrc5p.apps.googleusercontent.com', // Замінити на свій Client ID
                callback: handleCredentialResponse
            });

            // Викликаємо вручну One Tap або вхід при кліку на кнопку
            document.getElementById('googleSignInBtn').addEventListener('click', () => {
                google.accounts.id.prompt();
            });
        };

        // Кнопка "На головну"
        document.getElementById('goHomeBtn').onclick = function() {
            window.location.href = '/';  // Змінити URL якщо потрібно
        };
    </script>

</body>
</html>
